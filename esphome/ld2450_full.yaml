    ld2450_id: ld2450_radar
    has_target:
      name: "Raw Radar Presence"
      id: raw_room_occupancy
      internal: true
    has_moving_target:
      name: "Moving Target"
      id: room_moving_target
      device_class: motion
    has_still_target:
