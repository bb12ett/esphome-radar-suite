# ====================================================================
# SHARED BASE: Hi-Link LD2450 mmWave Radar + Bluetooth Proxy (BLE)
# Everything Presence Lite Architecture + 4 Detection Zones + 3 Hardware
# Exclusion Zones + "Stationary Presence Memory" + One-Touch Zone Calibrator
# Optimized for ESP32 / ESP32-C3 + Home Assistant
# ====================================================================

substitutions:
  board: "esp32-c3-devkitm-1"
  tx_pin: "GPIO21"
  rx_pin: "GPIO20"

esphome:
  name: "${node_name}"
  friendly_name: "${friendly_name}"
  min_version: 2024.6.0
  includes:
    - presence_memory.h
  on_boot:
    priority: -100
    then:
      - delay: 3s
      # Ensure Multi-Target tracking is ON by default
      - switch.turn_on: multi_target_switch

esp32:
  board: "${board}"
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  platform: esphome

# --------------------------------------------------------------------
# 1. HARDWARE UART BUS FOR LD2450
# --------------------------------------------------------------------
uart:
  id: radar_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# --------------------------------------------------------------------
# 2. LD2450 mmWAVE RADAR COMPONENT
# --------------------------------------------------------------------
ld2450:
  id: ld2450_radar
  uart_id: radar_uart

# --------------------------------------------------------------------
# 3. OCCUPANCY & ZONE BINARY SENSORS
# --------------------------------------------------------------------
binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Raw Radar Presence"
      id: raw_room_occupancy
      internal: true
    has_moving_target:
      name: "Moving Target"
      id: room_moving_target
      device_class: motion
    has_still_target:
      name: "Still Target"
      id: room_still_target
      device_class: occupancy

  # Main Room Occupancy (Managed by Presence Memory Tracker)
  - platform: template
    name: "Occupancy"
    id: room_occupancy
    device_class: occupancy
    icon: "mdi:motion-sensor"

  # 4 Detection Zones (Managed by Presence Memory Tracker)
  - platform: template
    name: "Zone 1 Occupancy"
    id: zone_1_occupancy
    device_class: occupancy
    icon: "mdi:vector-square"

  - platform: template
    name: "Zone 2 Occupancy"
    id: zone_2_occupancy
    device_class: occupancy
    icon: "mdi:vector-square"

  - platform: template
    name: "Zone 3 Occupancy"
    id: zone_3_occupancy
    device_class: occupancy
    icon: "mdi:vector-square"

  - platform: template
    name: "Zone 4 Occupancy"
    id: zone_4_occupancy
    device_class: occupancy
    icon: "mdi:vector-square"

  # Diagnostics: Visual feedback when "Stationary Presence Memory" is holding the state
  - platform: template
    name: "Stationary Memory Active"
    id: room_stationary_latched
    entity_category: diagnostic
    icon: "mdi:brain"

  - platform: template
    name: "Zone 1 Memory Active"
    id: z1_stationary_latched
    entity_category: diagnostic
    icon: "mdi:brain"

  - platform: template
    name: "Zone 2 Memory Active"
    id: z2_stationary_latched
    entity_category: diagnostic
    icon: "mdi:brain"

  - platform: template
    name: "Zone 3 Memory Active"
    id: z3_stationary_latched
    entity_category: diagnostic
    icon: "mdi:brain"

  - platform: template
    name: "Zone 4 Memory Active"
    id: z4_stationary_latched
    entity_category: diagnostic
    icon: "mdi:brain"

# --------------------------------------------------------------------
# 4. TARGET COORDINATES, COUNTS & ZONE SENSORS
# --------------------------------------------------------------------
sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Raw Radar Target Count"
      id: raw_target_count
      internal: true
    still_target_count:
      name: "Still Target Count"
    moving_target_count:
      name: "Moving Target Count"

    # Target 1 (Primary human detected)
    target_1:
      x:
        name: "Target 1 X"
        id: t1_x
        filters:
          - throttle: 250ms
      y:
        name: "Target 1 Y"
        id: t1_y
        filters:
          - throttle: 250ms
      speed:
        name: "Target 1 Speed"
        id: t1_speed
        filters:
          - throttle: 500ms
      angle:
        name: "Target 1 Angle"
        id: t1_angle
        filters:
          - throttle: 500ms
      distance:
        name: "Target 1 Distance"
        id: t1_dist
        filters:
          - throttle: 250ms
      resolution:
        name: "Target 1 Resolution"
        id: t1_res
        filters:
          - throttle: 1000ms

    # Target 2
    target_2:
      x:
        name: "Target 2 X"
        id: t2_x
        filters:
          - throttle: 250ms
      y:
        name: "Target 2 Y"
        id: t2_y
        filters:
          - throttle: 250ms
      speed:
        name: "Target 2 Speed"
        id: t2_speed
        filters:
          - throttle: 500ms
      angle:
        name: "Target 2 Angle"
        id: t2_angle
        filters:
          - throttle: 500ms
      distance:
        name: "Target 2 Distance"
        id: t2_dist
        filters:
          - throttle: 250ms
      resolution:
        name: "Target 2 Resolution"
        id: t2_res
        filters:
          - throttle: 1000ms

    # Target 3
    target_3:
      x:
        name: "Target 3 X"
        id: t3_x
        filters:
          - throttle: 250ms
      y:
        name: "Target 3 Y"
        id: t3_y
        filters:
          - throttle: 250ms
      speed:
        name: "Target 3 Speed"
        id: t3_speed
        filters:
          - throttle: 500ms
      angle:
        name: "Target 3 Angle"
        id: t3_angle
        filters:
          - throttle: 500ms
      distance:
        name: "Target 3 Distance"
        id: t3_dist
        filters:
          - throttle: 250ms
      resolution:
        name: "Target 3 Resolution"
        id: t3_res
        filters:
          - throttle: 1000ms

  # Filtered People Counters (Synced with Presence Memory Tracker)
  - platform: template
    name: "Target Count"
    id: active_target_count
    icon: "mdi:account-group"
    accuracy_decimals: 0

  - platform: template
    name: "Zone 1 Target Count"
    id: z1_target_count
    icon: "mdi:map-marker-account"
    accuracy_decimals: 0

  - platform: template
    name: "Zone 2 Target Count"
    id: z2_target_count
    icon: "mdi:map-marker-account"
    accuracy_decimals: 0

  - platform: template
    name: "Zone 3 Target Count"
    id: z3_target_count
    icon: "mdi:map-marker-account"
    accuracy_decimals: 0

  - platform: template
    name: "Zone 4 Target Count"
    id: z4_target_count
    icon: "mdi:map-marker-account"
    accuracy_decimals: 0

  # Diagnostics & Network
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

# --------------------------------------------------------------------
# 5. DIRECTION & DIAGNOSTIC TEXT SENSORS
# --------------------------------------------------------------------
text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "Radar Firmware Version"
    mac_address:
      name: "Radar MAC Address"
    target_1:
      direction:
        name: "Target 1 Direction"
    target_2:
      direction:
        name: "Target 2 Direction"
    target_3:
      direction:
        name: "Target 3 Direction"

  # Live Target Position & Zone Calibration Feedback
  - platform: template
    name: "Live Target Position"
    id: live_target_position
    icon: "mdi:crosshairs-gps"

  - platform: template
    name: "Zone Calibration Status"
    id: zone_calibration_status
    icon: "mdi:ruler-square"

# --------------------------------------------------------------------
# 6. CONFIGURATION NUMBERS & ZONE COORDINATES
# --------------------------------------------------------------------
number:
  # Room Presence Timeout (Used when target physically exits the room)
  # Plus Hardware Mask / Exclusion Zones 1-3 (stored in LD2450 NVRAM when Zone Type = Filter)
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Presence Timeout"
      id: presence_timeout_num
      mode: box
    zone_1:
      x1:
        name: "Exclusion Zone 1 X1"
        mode: box
      y1:
        name: "Exclusion Zone 1 Y1"
        mode: box
      x2:
        name: "Exclusion Zone 1 X2"
        mode: box
      y2:
        name: "Exclusion Zone 1 Y2"
        mode: box
    zone_2:
      x1:
        name: "Exclusion Zone 2 X1"
        mode: box
      y1:
        name: "Exclusion Zone 2 Y1"
        mode: box
      x2:
        name: "Exclusion Zone 2 X2"
        mode: box
      y2:
        name: "Exclusion Zone 2 Y2"
        mode: box
    zone_3:
      x1:
        name: "Exclusion Zone 3 X1"
        mode: box
      y1:
        name: "Exclusion Zone 3 Y1"
        mode: box
      x2:
        name: "Exclusion Zone 3 X2"
        mode: box
      y2:
        name: "Exclusion Zone 3 Y2"
        mode: box

  # Zone Off Delay / Hold Time when person physically leaves the zone
  - platform: template
    name: "Zone Off Delay"
    id: zone_off_delay
    entity_category: config
    unit_of_measurement: "s"
    icon: "mdi:timer-sand"
    min_value: 0
    max_value: 600
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5

  # Max Detection Distance Cutoff for the room
  - platform: template
    name: "Max Distance"
    id: max_distance
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:signal-distance-variant"
    min_value: 500
    max_value: 7500
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 6000

  # Stationary Presence Memory Watchdog Timeout (Minutes before clearing if target vanished without exiting)
  - platform: template
    name: "Stationary Latch Timeout"
    id: stationary_latch_timeout
    entity_category: config
    unit_of_measurement: "min"
    icon: "mdi:clock-alert-outline"
    min_value: 1
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30

  # Exit Trajectory Margin (Distance outside zone/perimeter required to confirm an exit movement)
  - platform: template
    name: "Exit Trajectory Margin"
    id: exit_trajectory_margin
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:vector-difference"
    min_value: 100
    max_value: 1000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 400

  # Calibration Box Padding (Expands zone box by X mm in each direction)
  - platform: template
    name: "Calibration Padding"
    id: calibration_padding
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-expand-all"
    min_value: 0
    max_value: 1000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 200

  # Sensor Installation / Mounting Yaw Angle (Rotates coordinate system to match room walls)
  - platform: template
    name: "Sensor Mounting Angle"
    id: sensor_mounting_angle
    entity_category: config
    unit_of_measurement: "°"
    icon: "mdi:rotate-3d-variant"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Outer Room Boundary (Eliminates through-wall false triggers)
  - platform: template
    name: "Room Boundary Min X"
    id: room_x1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:wall"
    min_value: -10000
    max_value: 10000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Room Boundary Min Y"
    id: room_y1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:wall"
    min_value: 0
    max_value: 15000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Room Boundary Max X"
    id: room_x2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:wall"
    min_value: -10000
    max_value: 10000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Room Boundary Max Y"
    id: room_y2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:wall"
    min_value: 0
    max_value: 15000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Room Setup & Placement Dimensions (For one-touch boundary generation)
  - platform: template
    name: "Room Width"
    id: room_width_input
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-expand-horizontal"
    min_value: 500
    max_value: 15000
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    name: "Room Depth"
    id: room_depth_input
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-expand-vertical"
    min_value: 500
    max_value: 15000
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5000

  - platform: template
    name: "Sensor Wall Offset X"
    id: sensor_wall_offset_x
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-left-right"
    min_value: -10000
    max_value: 10000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 Angle"
    id: z1_angle
    entity_category: config
    unit_of_measurement: "°"
    icon: "mdi:angle-acute"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Zone 2 Angle"
    id: z2_angle
    entity_category: config
    unit_of_measurement: "°"
    icon: "mdi:angle-acute"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Zone 3 Angle"
    id: z3_angle
    entity_category: config
    unit_of_measurement: "°"
    icon: "mdi:angle-acute"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Zone 4 Angle"
    id: z4_angle
    entity_category: config
    unit_of_measurement: "°"
    icon: "mdi:angle-acute"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Detection Zone 1 Coordinates (ESP32 NVRAM)
  - platform: template
    name: "Zone 1 X1"
    id: z1_x1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-top-left-bold-box-outline"
    min_value: -4860
    max_value: 4860
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 Y1"
    id: z1_y1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-top-left"
    min_value: 0
    max_value: 7560
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 X2"
    id: z1_x2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-bottom-right-bold-box-outline"
    min_value: -4860
    max_value: 4860
    step: 10
    mode: box
    optimistic: true
    restore_value: true
