      id: room_still_target
      device_class: occupancy

  # Main Room Occupancy (Managed by Presence Memory Tracker)
  - platform: template
    name: "Occupancy"
    id: room_occupancy
    device_class: occupancy
    icon: "mdi:motion-sensor"

  # 10 Multi-Mode Zones (Managed by Presence Memory Tracker)
