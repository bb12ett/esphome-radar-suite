# --------------------------------------------------------------------
# 7. RADAR MODE SELECTORS & SWITCHES
# --------------------------------------------------------------------
select:
  - platform: ld2450
    ld2450_id: ld2450_radar
    zone_type:
      name: "Hardware Exclusion Mode"
    baud_rate:
      name: "Radar Baud Rate"

  - platform: template
    name: "Zone to Calibrate"
    id: calibrate_zone_select
    icon: "mdi:vector-selection"
    optimistic: true
    options:
      - "Zone 1"
      - "Zone 2"
      - "Zone 3"
      - "Zone 4"
      - "Room Boundary"
    initial_option: "Zone 1"

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    multi_target:
      name: "Multi Target Tracking"
      id: multi_target_switch
    bluetooth:
      name: "Radar Bluetooth"

  # Vanish Protection / Stationary Presence Memory Toggle
  - platform: template
    name: "Stationary Presence Memory"
    id: vanish_protection_switch
    icon: "mdi:brain"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# --------------------------------------------------------------------
# 8. RADAR & ONE-TOUCH ZONE CALIBRATION BUTTONS
# --------------------------------------------------------------------
button:
  - platform: restart
    name: "Restart ESP32"
  - platform: ld2450
    ld2450_id: ld2450_radar
    restart:
      name: "Restart Radar"
    factory_reset:
      name: "Factory Reset Radar"

  - platform: template
    name: "Set Zone Corner 1"
    id: btn_set_corner_1
    icon: "mdi:vector-point-select"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 4) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));

          float mount_yaw = id(sensor_mounting_angle).state;
          bool radar_has_target = id(raw_room_occupancy).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->state;
            float ry = y_s->state;
            t.dist = d_s->state;
            t.speed = sp_s->state;
            t.angle = a_s->state;

            if (mount_yaw != 0.0f && !std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::rotate_point(rx, ry, mount_yaw, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.active = radar_has_target &&
                       !std::isnan(t.dist) && t.dist > 0.0f &&
                       !std::isnan(t.x) && !std::isnan(t.y);
          };

          esphome::presence_memory::TargetData cur_targets[3];
          setup_target(cur_targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(cur_targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(cur_targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          float x = 0, y = 0, dist = 0;
          if (esphome::presence_memory::g_calibrator.get_active_position(cur_targets, x, y, dist)) {
            esphome::presence_memory::g_calibrator.point_a[z_idx].x = x;
            esphome::presence_memory::g_calibrator.point_a[z_idx].y = y;
            esphome::presence_memory::g_calibrator.point_a[z_idx].set = true;
            char buf[128];
            snprintf(buf, sizeof(buf), "%s: Corner 1 captured at X=%.0f, Y=%.0f mm. Move to opposite corner & press Corner 2.", sel.c_str(), x, y);
            id(zone_calibration_status).publish_state(buf);
            ESP_LOGI("calibrator", "%s", buf);
          } else {
            id(zone_calibration_status).publish_state("No target detected! Stand/sit in the corner and try again.");
          }

  - platform: template
    name: "Set Zone Corner 2"
    id: btn_set_corner_2
    icon: "mdi:vector-rectangle"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 4) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));

          if (!esphome::presence_memory::g_calibrator.point_a[z_idx].set) {
            id(zone_calibration_status).publish_state("Please press 'Set Zone Corner 1' first!");
            return;
          }

          float mount_yaw = id(sensor_mounting_angle).state;
          bool radar_has_target = id(raw_room_occupancy).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->state;
            float ry = y_s->state;
            t.dist = d_s->state;
            t.speed = sp_s->state;
            t.angle = a_s->state;

            if (mount_yaw != 0.0f && !std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::rotate_point(rx, ry, mount_yaw, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.active = radar_has_target &&
                       !std::isnan(t.dist) && t.dist > 0.0f &&
                       !std::isnan(t.x) && !std::isnan(t.y);
          };

          esphome::presence_memory::TargetData cur_targets[3];
          setup_target(cur_targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(cur_targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(cur_targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          float x = 0, y = 0, dist = 0;
          if (esphome::presence_memory::g_calibrator.get_active_position(cur_targets, x, y, dist)) {
            float xa = esphome::presence_memory::g_calibrator.point_a[z_idx].x;
            float ya = esphome::presence_memory::g_calibrator.point_a[z_idx].y;
            float xb = x;
            float yb = y;
            float pad = id(calibration_padding).state;

            float d = std::hypot(xa - xb, ya - yb);
            if (d < 300.0f) {
              char warn_buf[140];
              snprintf(warn_buf, sizeof(warn_buf), "Warning: Corner 2 is only %.0fcm from Corner 1! Walk to the opposite corner and press again.", d / 10.0f);
              id(zone_calibration_status).publish_state(warn_buf);
              return;
            }

            auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
              auto call = num->make_call();
              call.set_value(val);
              call.perform();
            };

            float min_x = 0, max_x = 0, min_y = 0, max_y = 0;

            if (z_idx == 4) {
              // Room Boundary (Axis-aligned outer perimeter)
              min_x = std::min(xa, xb) - pad;
              max_x = std::max(xa, xb) + pad;
              min_y = std::max(0.0f, std::min(ya, yb) - pad);
              max_y = std::max(ya, yb) + pad;
              set_num(id(room_x1), min_x);
              set_num(id(room_y1), min_y);
              set_num(id(room_x2), max_x);
              set_num(id(room_y2), max_y);
            } else {
              float z_angle = 0.0f;
              if (z_idx == 0) z_angle = id(z1_angle).state;
              else if (z_idx == 1) z_angle = id(z2_angle).state;
              else if (z_idx == 2) z_angle = id(z3_angle).state;
              else if (z_idx == 3) z_angle = id(z4_angle).state;

              if (z_angle == 0.0f) {
                min_x = std::min(xa, xb) - pad;
                max_x = std::max(xa, xb) + pad;
                min_y = std::max(0.0f, std::min(ya, yb) - pad);
                max_y = std::max(ya, yb) + pad;
              } else {
                float mx = (xa + xb) * 0.5f;
                float my = (ya + yb) * 0.5f;
                float ua = 0, va = 0, ub = 0, vb = 0;
                esphome::presence_memory::rotate_point(xa - mx, ya - my, -z_angle, ua, va);
                esphome::presence_memory::rotate_point(xb - mx, yb - my, -z_angle, ub, vb);
                float hw = std::max(fabsf(ua), fabsf(ub)) + pad;
                float hh = std::max(fabsf(va), fabsf(vb)) + pad;
                min_x = mx - hw;
                max_x = mx + hw;
                min_y = my - hh;
                max_y = my + hh;
              }

              if (z_idx == 0) {
                set_num(id(z1_x1), min_x); set_num(id(z1_y1), min_y);
                set_num(id(z1_x2), max_x); set_num(id(z1_y2), max_y);
              } else if (z_idx == 1) {
                set_num(id(z2_x1), min_x); set_num(id(z2_y1), min_y);
                set_num(id(z2_x2), max_x); set_num(id(z2_y2), max_y);
              } else if (z_idx == 2) {
                set_num(id(z3_x1), min_x); set_num(id(z3_y1), min_y);
                set_num(id(z3_x2), max_x); set_num(id(z3_y2), max_y);
              } else if (z_idx == 3) {
                set_num(id(z4_x1), min_x); set_num(id(z4_y1), min_y);
                set_num(id(z4_x2), max_x); set_num(id(z4_y2), max_y);
              }
            }

            // Commit immediately to ESP32 physical flash storage
            global_preferences->sync();

            esphome::presence_memory::g_calibrator.point_a[z_idx].set = false;
            char buf[128];
            snprintf(buf, sizeof(buf), "%s set! X: [%.0f to %.0f], Y: [%.0f to %.0f] mm", sel.c_str(), min_x, max_x, min_y, max_y);
            id(zone_calibration_status).publish_state(buf);
            ESP_LOGI("calibrator", "%s", buf);
          } else {
            id(zone_calibration_status).publish_state("No target detected! Stand/sit in the corner and try again.");
          }

  - platform: template
    name: "Clear Selected Zone"
    id: btn_clear_zone
    icon: "mdi:vector-selection-remove"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 4) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));
          esphome::presence_memory::g_calibrator.point_a[z_idx].set = false;
          auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
            auto call = num->make_call();
            call.set_value(val);
            call.perform();
          };
          if (z_idx == 0) { set_num(id(z1_x1), 0); set_num(id(z1_y1), 0); set_num(id(z1_x2), 0); set_num(id(z1_y2), 0); }
          else if (z_idx == 1) { set_num(id(z2_x1), 0); set_num(id(z2_y1), 0); set_num(id(z2_x2), 0); set_num(id(z2_y2), 0); }
          else if (z_idx == 2) { set_num(id(z3_x1), 0); set_num(id(z3_y1), 0); set_num(id(z3_x2), 0); set_num(id(z3_y2), 0); }
          else if (z_idx == 3) { set_num(id(z4_x1), 0); set_num(id(z4_y1), 0); set_num(id(z4_x2), 0); set_num(id(z4_y2), 0); }
          else if (z_idx == 4) { set_num(id(room_x1), 0); set_num(id(room_y1), 0); set_num(id(room_x2), 0); set_num(id(room_y2), 0); }
          global_preferences->sync();
          char buf[64];
          snprintf(buf, sizeof(buf), "%s cleared (disabled).", sel.c_str());
          id(zone_calibration_status).publish_state(buf);

  - platform: template
    name: "Apply Room Dimensions to Boundary"
    id: btn_apply_room_dimensions
    icon: "mdi:calculator-variant"
    entity_category: config
    on_press:
      - lambda: |-
          float w = id(room_width_input).state;
          float d = id(room_depth_input).state;
          float off_x = id(sensor_wall_offset_x).state;
          float yaw = id(sensor_mounting_angle).state;

          float min_x = 0, max_x = 0, min_y = 0, max_y = 0;

          if (fabsf(yaw - (-45.0f)) < 2.0f) {
            // Front-Left corner angled 45° across room
            min_x = 0.0f;
            max_x = w;
            min_y = 0.0f;
            max_y = d;
          } else if (fabsf(yaw - 45.0f) < 2.0f) {
            // Front-Right corner angled 45° across room
            min_x = -w;
            max_x = 0.0f;
            min_y = 0.0f;
            max_y = d;
          } else {
            // Wall mount (center if off_x=0, or offset by off_x)
            min_x = -(w * 0.5f + off_x);
            max_x = +(w * 0.5f - off_x);
            min_y = 0.0f;
            max_y = d;
          }

          auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
            auto call = num->make_call();
            call.set_value(val);
            call.perform();
          };

          set_num(id(room_x1), min_x);
          set_num(id(room_x2), max_x);
          set_num(id(room_y1), min_y);
          set_num(id(room_y2), max_y);
          global_preferences->sync();

          char buf[128];
          snprintf(buf, sizeof(buf), "Boundaries set: X=[%.0f, %.0f], Y=[%.0f, %.0f] mm", min_x, max_x, min_y, max_y);
          id(zone_calibration_status).publish_state(buf);
          ESP_LOGI("room_setup", "%s", buf);

# --------------------------------------------------------------------
# 9. REAL-TIME PRESENCE MEMORY & TRAJECTORY TRACKING ENGINE (100ms)
# --------------------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static esphome::presence_memory::RoomTracker s_room;
          static esphome::presence_memory::ZoneTracker s_zones[4];

          esphome::presence_memory::TargetData targets[3];
          bool radar_has_target = id(raw_room_occupancy).state;
          float mount_yaw = id(sensor_mounting_angle).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->state;
            float ry = y_s->state;
            t.dist = d_s->state;
            t.speed = sp_s->state;
            t.angle = a_s->state;

            if (mount_yaw != 0.0f && !std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::rotate_point(rx, ry, mount_yaw, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.active = radar_has_target &&
                       !std::isnan(t.dist) && t.dist > 0.0f &&
                       !std::isnan(t.x) && !std::isnan(t.y);
          };

          setup_target(targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          // Room boundary filter: Drop targets physically outside the room walls
          float rx1 = id(room_x1).state, ry1 = id(room_y1).state;
          float rx2 = id(room_x2).state, ry2 = id(room_y2).state;
          bool has_room_boundary = !(rx1 == 0 && ry1 == 0 && rx2 == 0 && ry2 == 0);
          if (has_room_boundary) {
            float min_rx = std::min(rx1, rx2);
            float max_rx = std::max(rx1, rx2);
            float min_ry = std::min(ry1, ry2);
            float max_ry = std::max(ry1, ry2);
            for (int i = 0; i < 3; i++) {
              if (targets[i].active) {
                if (targets[i].x < min_rx || targets[i].x > max_rx ||
                    targets[i].y < min_ry || targets[i].y > max_ry) {
                  targets[i].active = false;
                }
              }
            }
          }

          bool vanish_prot = id(vanish_protection_switch).state;
          float latch_timeout_min = id(stationary_latch_timeout).state;
          float exit_margin = id(exit_trajectory_margin).state;
          float zone_hold = id(zone_off_delay).state;
          float room_timeout = id(presence_timeout_num).state;
          float max_d = id(max_distance).state;

          // Update calibrator targets
          esphome::presence_memory::g_calibrator.update_targets(targets);

          // Update Live Target Position text sensor (every 400ms)
          static uint32_t last_pos_pub = 0;
          uint32_t now = millis();
          if (now - last_pos_pub >= 400) {
            last_pos_pub = now;
            float cur_x = 0, cur_y = 0, cur_dist = 0;
            if (esphome::presence_memory::g_calibrator.get_active_position(targets, cur_x, cur_y, cur_dist)) {
              char pos_buf[80];
              snprintf(pos_buf, sizeof(pos_buf), "X: %.0f mm, Y: %.0f mm (%.2fm)", cur_x, cur_y, cur_dist / 1000.0f);
              if (!id(live_target_position).has_state() || id(live_target_position).state != pos_buf) {
                id(live_target_position).publish_state(pos_buf);
              }
            } else {
              if (!id(live_target_position).has_state() || id(live_target_position).state != "No Target") {
                id(live_target_position).publish_state("No Target");
              }
            }
          }

          // 1. Zone 1 Tracker Update
          s_zones[0].update(id(z1_x1).state, id(z1_y1).state, id(z1_x2).state, id(z1_y2).state, id(z1_angle).state,
                            targets, vanish_prot, zone_hold, latch_timeout_min, exit_margin);
          if (!id(zone_1_occupancy).has_state() || id(zone_1_occupancy).state != s_zones[0].occupied) {
            id(zone_1_occupancy).publish_state(s_zones[0].occupied);
          }
          if (!id(z1_stationary_latched).has_state() || id(z1_stationary_latched).state != s_zones[0].latched) {
            id(z1_stationary_latched).publish_state(s_zones[0].latched);
          }
          if (!id(z1_target_count).has_state() || id(z1_target_count).state != s_zones[0].target_count) {
            id(z1_target_count).publish_state(s_zones[0].target_count);
          }

          // 2. Zone 2 Tracker Update
          s_zones[1].update(id(z2_x1).state, id(z2_y1).state, id(z2_x2).state, id(z2_y2).state, id(z2_angle).state,
                            targets, vanish_prot, zone_hold, latch_timeout_min, exit_margin);
          if (!id(zone_2_occupancy).has_state() || id(zone_2_occupancy).state != s_zones[1].occupied) {
            id(zone_2_occupancy).publish_state(s_zones[1].occupied);
          }
          if (!id(z2_stationary_latched).has_state() || id(z2_stationary_latched).state != s_zones[1].latched) {
            id(z2_stationary_latched).publish_state(s_zones[1].latched);
          }
          if (!id(z2_target_count).has_state() || id(z2_target_count).state != s_zones[1].target_count) {
            id(z2_target_count).publish_state(s_zones[1].target_count);
          }

          // 3. Zone 3 Tracker Update
          s_zones[2].update(id(z3_x1).state, id(z3_y1).state, id(z3_x2).state, id(z3_y2).state, id(z3_angle).state,
                            targets, vanish_prot, zone_hold, latch_timeout_min, exit_margin);
          if (!id(zone_3_occupancy).has_state() || id(zone_3_occupancy).state != s_zones[2].occupied) {
            id(zone_3_occupancy).publish_state(s_zones[2].occupied);
          }
          if (!id(z3_stationary_latched).has_state() || id(z3_stationary_latched).state != s_zones[2].latched) {
            id(z3_stationary_latched).publish_state(s_zones[2].latched);
          }
          if (!id(z3_target_count).has_state() || id(z3_target_count).state != s_zones[2].target_count) {
            id(z3_target_count).publish_state(s_zones[2].target_count);
          }

          // 4. Zone 4 Tracker Update
          s_zones[3].update(id(z4_x1).state, id(z4_y1).state, id(z4_x2).state, id(z4_y2).state, id(z4_angle).state,
                            targets, vanish_prot, zone_hold, latch_timeout_min, exit_margin);
          if (!id(zone_4_occupancy).has_state() || id(zone_4_occupancy).state != s_zones[3].occupied) {
            id(zone_4_occupancy).publish_state(s_zones[3].occupied);
          }
          if (!id(z4_stationary_latched).has_state() || id(z4_stationary_latched).state != s_zones[3].latched) {
            id(z4_stationary_latched).publish_state(s_zones[3].latched);
          }
          if (!id(z4_target_count).has_state() || id(z4_target_count).state != s_zones[3].target_count) {
            id(z4_target_count).publish_state(s_zones[3].target_count);
          }

          // 5. Room Tracker Update (Evaluated with room boundary and zone latches)
          bool any_zone_latched = s_zones[0].latched || s_zones[1].latched || s_zones[2].latched || s_zones[3].latched;
          s_room.update(targets, max_d, rx1, ry1, rx2, ry2, vanish_prot, room_timeout, latch_timeout_min, exit_margin, any_zone_latched);
          if (!id(room_occupancy).has_state() || id(room_occupancy).state != s_room.occupied) {
            id(room_occupancy).publish_state(s_room.occupied);
          }
          if (!id(room_stationary_latched).has_state() || id(room_stationary_latched).state != s_room.latched) {
            id(room_stationary_latched).publish_state(s_room.latched);
          }
          if (!id(active_target_count).has_state() || id(active_target_count).state != s_room.target_count) {
            id(active_target_count).publish_state(s_room.target_count);
          }

# --------------------------------------------------------------------
# 10. ACTIVE BLUETOOTH PROXY (For Bermuda BLE Triangulation)
# --------------------------------------------------------------------
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
