  - platform: template
    name: "Zone 2 X2"
    id: z2_x2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-bottom-right-bold-box-outline"
    min_value: -4860
    max_value: 4860
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 2 Y2"
    id: z2_y2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-bottom-right"
    min_value: 0
    max_value: 7560
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Detection Zone 3 Coordinates (ESP32 NVRAM)
  - platform: template
    name: "Zone 3 X1"
    id: z3_x1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
