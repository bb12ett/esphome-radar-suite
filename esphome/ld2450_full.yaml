# --------------------------------------------------------------------
# 4. TARGET COORDINATES, COUNTS & ZONE SENSORS
# --------------------------------------------------------------------
sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Raw Radar Target Count"
      id: raw_target_count
      internal: true
    still_target_count:
      name: "Still Target Count"
    moving_target_count:
      name: "Moving Target Count"

    # Target 1 (Primary human detected)
    # throttle_with_priority (default priority value: nan) limits Home Assistant traffic but always
    # passes the single NAN the LD2450 driver publishes when a target slot clears. A plain
    # `throttle` can swallow that NAN and leave a frozen "ghost" target behind.
    # The on-device trackers read get_raw_state() so they still see every 10 Hz frame.
    target_1:
      x:
        name: "Target 1 X"
        id: t1_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 1 Y"
        id: t1_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 1 Speed"
        id: t1_speed
        filters:
          - throttle_with_priority: 500ms
      angle:
        name: "Target 1 Angle"
        id: t1_angle
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 1 Distance"
        id: t1_dist
        filters:
          - throttle_with_priority: 250ms
      resolution:
        name: "Target 1 Resolution"
        id: t1_res
        filters:
          - throttle_with_priority: 1000ms

    # Target 2
    target_2:
      x:
        name: "Target 2 X"
        id: t2_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 2 Y"
        id: t2_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 2 Speed"
        id: t2_speed
        filters:
          - throttle_with_priority: 500ms
      angle:
        name: "Target 2 Angle"
        id: t2_angle
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 2 Distance"
        id: t2_dist
        filters:
          - throttle_with_priority: 250ms
      resolution:
        name: "Target 2 Resolution"
        id: t2_res
        filters:
          - throttle_with_priority: 1000ms

    # Target 3
    target_3:
      x:
        name: "Target 3 X"
        id: t3_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 3 Y"
        id: t3_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 3 Speed"
        id: t3_speed
        filters:
          - throttle_with_priority: 500ms
      angle:
        name: "Target 3 Angle"
        id: t3_angle
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 3 Distance"
        id: t3_dist
        filters:
          - throttle_with_priority: 250ms
      resolution:
        name: "Target 3 Resolution"
        id: t3_res
        filters:
          - throttle_with_priority: 1000ms

  # Filtered People Counters (Synced with Presence Memory Tracker)
  - platform: template
    name: "Target Count"
    id: active_target_count
    icon: "mdi:account-group"
    accuracy_decimals: 0

