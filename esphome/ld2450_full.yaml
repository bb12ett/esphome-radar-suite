# ====================================================================
# SHARED BASE: Hi-Link LD2450 mmWave Radar + Bluetooth Proxy (BLE)
# Everything Presence Lite Architecture + 10 Multi-Mode Software Zones
# (Detection / Exclusion) + "Stationary Presence Memory" + Zone Calibrator
# Optimized for ESP32 / ESP32-C3 + Home Assistant
# ====================================================================

substitutions:
  board: "esp32-c3-devkitm-1"
  tx_pin: "GPIO21"
  rx_pin: "GPIO20"

esphome:
  name: "${node_name}"
  friendly_name: "${friendly_name}"
  min_version: 2024.6.0
  includes:
    - presence_memory.h
  on_boot:
    priority: -100
    then:
      - delay: 3s
      # Ensure Multi-Target tracking is ON by default
      - switch.turn_on: multi_target_switch

esp32:
  board: "${board}"
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  platform: esphome

# --------------------------------------------------------------------
# 1. HARDWARE UART BUS FOR LD2450
# --------------------------------------------------------------------
uart:
  id: radar_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# --------------------------------------------------------------------
# 2. LD2450 mmWAVE RADAR COMPONENT
# --------------------------------------------------------------------
ld2450:
  id: ld2450_radar
  uart_id: radar_uart

# --------------------------------------------------------------------
# 3. OCCUPANCY & ZONE BINARY SENSORS
# --------------------------------------------------------------------
binary_sensor:
