  - platform: template
    name: "Zone 1 Y2"
    id: z1_y2
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
    icon: "mdi:arrow-bottom-right"
    min_value: 0
    max_value: 7560
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Detection Zone 2 Coordinates (ESP32 NVRAM)
  - platform: template
    name: "Zone 2 X1"
    id: z2_x1
    entity_category: config
    device_class: distance
    unit_of_measurement: "mm"
