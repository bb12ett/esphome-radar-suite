# --------------------------------------------------------------------
# 8. RADAR & ONE-TOUCH ZONE CALIBRATION BUTTONS
# --------------------------------------------------------------------
button:
  - platform: restart
    name: "Restart ESP32"
  - platform: ld2450
    ld2450_id: ld2450_radar
    restart:
      name: "Restart Radar"
    factory_reset:
      name: "Factory Reset Radar"

  - platform: template
    name: "Set Zone Corner 1"
    id: btn_set_corner_1
    icon: "mdi:vector-point-select"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 10) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));

          float mount_yaw = id(sensor_mounting_angle).state;
          bool radar_has_target = id(raw_room_occupancy).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->get_raw_state();
            float ry = y_s->get_raw_state();
            t.dist = d_s->get_raw_state();
            t.speed = sp_s->get_raw_state();
            t.angle = a_s->get_raw_state();

            if (!std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::sensor_raw_to_room_aligned(
                  rx, ry, mount_yaw, id(invert_x_switch).state, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.raw_active = radar_has_target &&
                           !std::isnan(t.dist) && t.dist > 0.0f &&
                           !std::isnan(t.x) && !std::isnan(t.y);
            t.active = t.raw_active;
          };

          esphome::presence_memory::TargetData cur_targets[3];
          setup_target(cur_targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(cur_targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(cur_targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          float x = 0, y = 0, dist = 0;
          if (esphome::presence_memory::g_calibrator.get_active_position(cur_targets, x, y, dist)) {
            esphome::presence_memory::g_calibrator.point_a[z_idx].x = x;
            esphome::presence_memory::g_calibrator.point_a[z_idx].y = y;
            esphome::presence_memory::g_calibrator.point_a[z_idx].set = true;
            char buf[128];
            snprintf(buf, sizeof(buf), "%s: Corner 1 captured at X=%.0f, Y=%.0f mm. Move to opposite corner & press Corner 2.", sel.c_str(), x, y);
            id(zone_calibration_status).publish_state(buf);
            ESP_LOGI("calibrator", "%s", buf);
          } else {
            id(zone_calibration_status).publish_state("No target detected! Stand/sit in the corner and try again.");
          }

  - platform: template
    name: "Set Zone Corner 2"
    id: btn_set_corner_2
    icon: "mdi:vector-rectangle"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 10) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));

          if (!esphome::presence_memory::g_calibrator.point_a[z_idx].set) {
            id(zone_calibration_status).publish_state("Please press 'Set Zone Corner 1' first!");
            return;
          }

          float mount_yaw = id(sensor_mounting_angle).state;
          bool radar_has_target = id(raw_room_occupancy).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->get_raw_state();
            float ry = y_s->get_raw_state();
            t.dist = d_s->get_raw_state();
            t.speed = sp_s->get_raw_state();
            t.angle = a_s->get_raw_state();

            if (!std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::sensor_raw_to_room_aligned(
                  rx, ry, mount_yaw, id(invert_x_switch).state, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.raw_active = radar_has_target &&
                           !std::isnan(t.dist) && t.dist > 0.0f &&
                           !std::isnan(t.x) && !std::isnan(t.y);
            t.active = t.raw_active;
          };

          esphome::presence_memory::TargetData cur_targets[3];
          setup_target(cur_targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(cur_targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(cur_targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          float x = 0, y = 0, dist = 0;
          if (esphome::presence_memory::g_calibrator.get_active_position(cur_targets, x, y, dist)) {
            float xa = esphome::presence_memory::g_calibrator.point_a[z_idx].x;
            float ya = esphome::presence_memory::g_calibrator.point_a[z_idx].y;
            float xb = x;
            float yb = y;
            float pad = id(calibration_padding).state;

            float d = std::hypot(xa - xb, ya - yb);
            if (d < 300.0f) {
              char warn_buf[140];
              snprintf(warn_buf, sizeof(warn_buf), "Warning: Corner 2 is only %.0fcm from Corner 1! Walk to the opposite corner and press again.", d / 10.0f);
              id(zone_calibration_status).publish_state(warn_buf);
              return;
            }

            auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
              val = std::max(num->traits.get_min_value(), std::min(num->traits.get_max_value(), val));
              auto call = num->make_call();
              call.set_value(val);
              call.perform();
            };

            esphome::template_::TemplateNumber *coords[10][4] = {
              {id(z1_x1), id(z1_y1), id(z1_x2), id(z1_y2)},
              {id(z2_x1), id(z2_y1), id(z2_x2), id(z2_y2)},
              {id(z3_x1), id(z3_y1), id(z3_x2), id(z3_y2)},
              {id(z4_x1), id(z4_y1), id(z4_x2), id(z4_y2)},
              {id(z5_x1), id(z5_y1), id(z5_x2), id(z5_y2)},
              {id(z6_x1), id(z6_y1), id(z6_x2), id(z6_y2)},
              {id(z7_x1), id(z7_y1), id(z7_x2), id(z7_y2)},
              {id(z8_x1), id(z8_y1), id(z8_x2), id(z8_y2)},
              {id(z9_x1), id(z9_y1), id(z9_x2), id(z9_y2)},
              {id(z10_x1), id(z10_y1), id(z10_x2), id(z10_y2)}
            };
            esphome::template_::TemplateNumber *angles[10] = {
              id(z1_angle), id(z2_angle), id(z3_angle), id(z4_angle), id(z5_angle),
              id(z6_angle), id(z7_angle), id(z8_angle), id(z9_angle), id(z10_angle)
            };

            float min_x = 0, max_x = 0, min_y = 0, max_y = 0;

            if (z_idx == 10) {
              // Room Boundary (Axis-aligned outer perimeter)
              min_x = std::min(xa, xb) - pad;
              max_x = std::max(xa, xb) + pad;
              min_y = std::max(0.0f, std::min(ya, yb) - pad);
              max_y = std::max(ya, yb) + pad;
              set_num(id(room_x1), min_x);
              set_num(id(room_y1), min_y);
              set_num(id(room_x2), max_x);
              set_num(id(room_y2), max_y);
            } else if (z_idx >= 0 && z_idx < 10) {
              float z_angle = angles[z_idx]->state;
              if (z_angle == 0.0f) {
                min_x = std::min(xa, xb) - pad;
                max_x = std::max(xa, xb) + pad;
                min_y = std::max(0.0f, std::min(ya, yb) - pad);
                max_y = std::max(ya, yb) + pad;
              } else {
                float mx = (xa + xb) * 0.5f;
                float my = (ya + yb) * 0.5f;
                float ua = 0, va = 0, ub = 0, vb = 0;
                esphome::presence_memory::rotate_point(xa - mx, ya - my, -z_angle, ua, va);
                esphome::presence_memory::rotate_point(xb - mx, yb - my, -z_angle, ub, vb);
                float hw = std::max(fabsf(ua), fabsf(ub)) + pad;
                float hh = std::max(fabsf(va), fabsf(vb)) + pad;
                min_x = mx - hw;
                max_x = mx + hw;
                min_y = std::max(0.0f, my - hh);
                max_y = my + hh;
              }

              set_num(coords[z_idx][0], min_x);
              set_num(coords[z_idx][1], min_y);
              set_num(coords[z_idx][2], max_x);
              set_num(coords[z_idx][3], max_y);
            }

            // Commit immediately to ESP32 physical flash storage
            global_preferences->sync();

            esphome::presence_memory::g_calibrator.point_a[z_idx].set = false;
            char buf[128];
            snprintf(buf, sizeof(buf), "%s set! X: [%.0f to %.0f], Y: [%.0f to %.0f] mm", sel.c_str(), min_x, max_x, min_y, max_y);
            id(zone_calibration_status).publish_state(buf);
            ESP_LOGI("calibrator", "%s", buf);
          } else {
            id(zone_calibration_status).publish_state("No target detected! Stand/sit in the corner and try again.");
          }

  - platform: template
    name: "Clear Selected Zone"
    id: btn_clear_zone
    icon: "mdi:vector-selection-remove"
    on_press:
      - lambda: |-
          int z_idx = id(calibrate_zone_select).active_index().value_or(0);
          std::string sel = (z_idx == 10) ? "Room Boundary" : ("Zone " + esphome::to_string(z_idx + 1));
          esphome::presence_memory::g_calibrator.point_a[z_idx].set = false;
          auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
            auto call = num->make_call();
            call.set_value(val);
            call.perform();
          };

          esphome::template_::TemplateNumber *coords[10][4] = {
            {id(z1_x1), id(z1_y1), id(z1_x2), id(z1_y2)},
            {id(z2_x1), id(z2_y1), id(z2_x2), id(z2_y2)},
            {id(z3_x1), id(z3_y1), id(z3_x2), id(z3_y2)},
            {id(z4_x1), id(z4_y1), id(z4_x2), id(z4_y2)},
            {id(z5_x1), id(z5_y1), id(z5_x2), id(z5_y2)},
            {id(z6_x1), id(z6_y1), id(z6_x2), id(z6_y2)},
            {id(z7_x1), id(z7_y1), id(z7_x2), id(z7_y2)},
            {id(z8_x1), id(z8_y1), id(z8_x2), id(z8_y2)},
            {id(z9_x1), id(z9_y1), id(z9_x2), id(z9_y2)},
            {id(z10_x1), id(z10_y1), id(z10_x2), id(z10_y2)}
          };
          esphome::template_::TemplateNumber *angles[10] = {
            id(z1_angle), id(z2_angle), id(z3_angle), id(z4_angle), id(z5_angle),
            id(z6_angle), id(z7_angle), id(z8_angle), id(z9_angle), id(z10_angle)
          };

          if (z_idx == 10) {
            set_num(id(room_x1), 0); set_num(id(room_y1), 0);
            set_num(id(room_x2), 0); set_num(id(room_y2), 0);
          } else if (z_idx >= 0 && z_idx < 10) {
            set_num(coords[z_idx][0], 0); set_num(coords[z_idx][1], 0);
            set_num(coords[z_idx][2], 0); set_num(coords[z_idx][3], 0);
            set_num(angles[z_idx], 0);
          }
          global_preferences->sync();
          char buf[64];
          snprintf(buf, sizeof(buf), "%s cleared (disabled).", sel.c_str());
          id(zone_calibration_status).publish_state(buf);

  - platform: template
    name: "Apply Room Dimensions to Boundary"
    id: btn_apply_room_dimensions
    icon: "mdi:calculator-variant"
    entity_category: config
    on_press:
      - lambda: |-
          float w = id(room_width_input).state;
          float d = id(room_depth_input).state;
          float off_x = id(sensor_wall_offset_x).state;
          float yaw = id(sensor_mounting_angle).state;

          float min_x = 0, max_x = 0, min_y = 0, max_y = 0;

          // Targets are rotated by the mounting angle before the boundary check, so the walls
          // relative to the sensor are the same for every angle. The sensor sits on the front wall
          // at (width/2 + offset_x). A true corner mount (offset = Â±width/2) gives [0, w] or [-w, 0].
          min_x = -(w * 0.5f + off_x);
          max_x = +(w * 0.5f - off_x);
          min_y = 0.0f;
          max_y = d;
          (void) yaw;

          auto set_num = [](esphome::template_::TemplateNumber *num, float val) {
            val = std::max(num->traits.get_min_value(), std::min(num->traits.get_max_value(), val));
            auto call = num->make_call();
            call.set_value(val);
            call.perform();
          };

          set_num(id(room_x1), min_x);
          set_num(id(room_x2), max_x);
          set_num(id(room_y1), min_y);
          set_num(id(room_y2), max_y);
          global_preferences->sync();

          char buf[128];
          snprintf(buf, sizeof(buf), "Boundaries set: X=[%.0f, %.0f], Y=[%.0f, %.0f] mm", min_x, max_x, min_y, max_y);
          id(zone_calibration_status).publish_state(buf);
          ESP_LOGI("room_setup", "%s", buf);

# --------------------------------------------------------------------
# 9. REAL-TIME PRESENCE MEMORY & TRAJECTORY TRACKING ENGINE (100ms)
# --------------------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static esphome::presence_memory::RoomTracker s_room;
          static esphome::presence_memory::ZoneTracker s_zones[10];

          esphome::presence_memory::TargetData targets[3];
          bool radar_has_target = id(raw_room_occupancy).state;
          float mount_yaw = id(sensor_mounting_angle).state;

          auto setup_target = [&](esphome::presence_memory::TargetData &t,
                                  esphome::sensor::Sensor *x_s,
                                  esphome::sensor::Sensor *y_s,
                                  esphome::sensor::Sensor *d_s,
                                  esphome::sensor::Sensor *sp_s,
                                  esphome::sensor::Sensor *a_s) {
            float rx = x_s->get_raw_state();
            float ry = y_s->get_raw_state();
            t.dist = d_s->get_raw_state();
            t.speed = sp_s->get_raw_state();
            t.angle = a_s->get_raw_state();

            if (!std::isnan(rx) && !std::isnan(ry)) {
              esphome::presence_memory::sensor_raw_to_room_aligned(
                  rx, ry, mount_yaw, id(invert_x_switch).state, t.x, t.y);
            } else {
              t.x = rx;
              t.y = ry;
            }

            t.raw_active = radar_has_target &&
                           !std::isnan(t.dist) && t.dist > 0.0f &&
                           !std::isnan(t.x) && !std::isnan(t.y);
            t.active = t.raw_active;
          };

          setup_target(targets[0], id(t1_x), id(t1_y), id(t1_dist), id(t1_speed), id(t1_angle));
          setup_target(targets[1], id(t2_x), id(t2_y), id(t2_dist), id(t2_speed), id(t2_angle));
          setup_target(targets[2], id(t3_x), id(t3_y), id(t3_dist), id(t3_speed), id(t3_angle));

          // 1. Room boundary filter: Drop targets physically outside the room walls
          float rx1 = id(room_x1).state, ry1 = id(room_y1).state;
          float rx2 = id(room_x2).state, ry2 = id(room_y2).state;
          esphome::presence_memory::RoomBounds room = esphome::presence_memory::make_room_bounds(rx1, ry1, rx2, ry2);
          if (room.valid) {
            for (int i = 0; i < 3; i++) {
              if (targets[i].active) {
                if (targets[i].x < room.min_x || targets[i].x > room.max_x ||
                    targets[i].y < room.min_y || targets[i].y > room.max_y) {
                  targets[i].active = false;
                }
              }
            }
          }

          float z_coords[10][4] = {
            {id(z1_x1).state, id(z1_y1).state, id(z1_x2).state, id(z1_y2).state},
            {id(z2_x1).state, id(z2_y1).state, id(z2_x2).state, id(z2_y2).state},
            {id(z3_x1).state, id(z3_y1).state, id(z3_x2).state, id(z3_y2).state},
            {id(z4_x1).state, id(z4_y1).state, id(z4_x2).state, id(z4_y2).state},
            {id(z5_x1).state, id(z5_y1).state, id(z5_x2).state, id(z5_y2).state},
            {id(z6_x1).state, id(z6_y1).state, id(z6_x2).state, id(z6_y2).state},
            {id(z7_x1).state, id(z7_y1).state, id(z7_x2).state, id(z7_y2).state},
            {id(z8_x1).state, id(z8_y1).state, id(z8_x2).state, id(z8_y2).state},
            {id(z9_x1).state, id(z9_y1).state, id(z9_x2).state, id(z9_y2).state},
            {id(z10_x1).state, id(z10_y1).state, id(z10_x2).state, id(z10_y2).state}
          };
          float z_angles[10] = {
            id(z1_angle).state, id(z2_angle).state, id(z3_angle).state, id(z4_angle).state, id(z5_angle).state,
            id(z6_angle).state, id(z7_angle).state, id(z8_angle).state, id(z9_angle).state, id(z10_angle).state
          };
          bool z_is_excl[10] = {
            id(z1_mode).active_index().value_or(0) == 1, id(z2_mode).active_index().value_or(0) == 1,
            id(z3_mode).active_index().value_or(0) == 1, id(z4_mode).active_index().value_or(0) == 1,
            id(z5_mode).active_index().value_or(0) == 1, id(z6_mode).active_index().value_or(0) == 1,
            id(z7_mode).active_index().value_or(0) == 1, id(z8_mode).active_index().value_or(0) == 1,
            id(z9_mode).active_index().value_or(0) == 1, id(z10_mode).active_index().value_or(0) == 1
          };

          bool z_configured[10];
          for (int z = 0; z < 10; z++) {
            z_configured[z] = !(z_coords[z][0] == 0 && z_coords[z][1] == 0 && z_coords[z][2] == 0 && z_coords[z][3] == 0);
          }

          // 2. Exclusion Zones Masking (Prunes false-positive targets before detection zones & room tracker)
          for (int z = 0; z < 10; z++) {
            if (z_configured[z] && z_is_excl[z]) {
              s_zones[z].update_exclusion(z_coords[z][0], z_coords[z][1], z_coords[z][2], z_coords[z][3], z_angles[z], targets);
              for (int i = 0; i < 3; i++) {
                if (targets[i].active && esphome::presence_memory::is_point_in_zone(
                        z_coords[z][0], z_coords[z][1], z_coords[z][2], z_coords[z][3], z_angles[z], targets[i].x, targets[i].y)) {
                  targets[i].active = false;
                }
              }
            }
          }

          bool vanish_prot = id(vanish_protection_switch).state;
          float latch_timeout_min = id(stationary_latch_timeout).state;
          float exit_margin = id(exit_trajectory_margin).state;
          float zone_hold = id(zone_off_delay).state;
          float room_timeout = id(presence_timeout_num).state;
          float max_d = id(max_distance).state;

          // Update calibrator targets
          esphome::presence_memory::g_calibrator.update_targets(targets);

          // Update Live Target Position text sensor (every 400ms)
          static uint32_t last_pos_pub = 0;
          uint32_t now = millis();
          if (now - last_pos_pub >= 400) {
            last_pos_pub = now;
            float cur_x = 0, cur_y = 0, cur_dist = 0;
            if (esphome::presence_memory::g_calibrator.get_active_position(targets, cur_x, cur_y, cur_dist)) {
              char pos_buf[80];
              snprintf(pos_buf, sizeof(pos_buf), "X: %.0f mm, Y: %.0f mm (%.2fm)", cur_x, cur_y, cur_dist / 1000.0f);
              if (!id(live_target_position).has_state() || id(live_target_position).state != pos_buf) {
                id(live_target_position).publish_state(pos_buf);
              }
            } else {
              if (!id(live_target_position).has_state() || id(live_target_position).state != "No Target") {
                id(live_target_position).publish_state("No Target");
              }
            }
          }

          // 3. Detection Zones Update
          for (int z = 0; z < 10; z++) {
            if (z_configured[z] && !z_is_excl[z]) {
              s_zones[z].update(z_coords[z][0], z_coords[z][1], z_coords[z][2], z_coords[z][3], z_angles[z],
                                targets, room, max_d, vanish_prot, zone_hold, latch_timeout_min, exit_margin);
            }
          }

          // 4. Publish Zone Binary Sensors & Target Counts
          esphome::binary_sensor::BinarySensor *occ_sensors[10] = {
            id(zone_1_occupancy), id(zone_2_occupancy), id(zone_3_occupancy), id(zone_4_occupancy), id(zone_5_occupancy),
            id(zone_6_occupancy), id(zone_7_occupancy), id(zone_8_occupancy), id(zone_9_occupancy), id(zone_10_occupancy)
          };
          esphome::binary_sensor::BinarySensor *latch_sensors[10] = {
            id(z1_stationary_latched), id(z2_stationary_latched), id(z3_stationary_latched), id(z4_stationary_latched), id(z5_stationary_latched),
            id(z6_stationary_latched), id(z7_stationary_latched), id(z8_stationary_latched), id(z9_stationary_latched), id(z10_stationary_latched)
          };
          esphome::sensor::Sensor *count_sensors[10] = {
            id(z1_target_count), id(z2_target_count), id(z3_target_count), id(z4_target_count), id(z5_target_count),
            id(z6_target_count), id(z7_target_count), id(z8_target_count), id(z9_target_count), id(z10_target_count)
          };

          for (int z = 0; z < 10; z++) {
            if (z_configured[z]) {
              if (!occ_sensors[z]->has_state() || occ_sensors[z]->state != s_zones[z].occupied) {
                occ_sensors[z]->publish_state(s_zones[z].occupied);
              }
              if (!latch_sensors[z]->has_state() || latch_sensors[z]->state != s_zones[z].latched) {
                latch_sensors[z]->publish_state(s_zones[z].latched);
              }
              if (!count_sensors[z]->has_state() || count_sensors[z]->state != s_zones[z].target_count) {
                count_sensors[z]->publish_state(s_zones[z].target_count);
              }
            } else {
              if (occ_sensors[z]->has_state() && occ_sensors[z]->state) occ_sensors[z]->publish_state(false);
              if (latch_sensors[z]->has_state() && latch_sensors[z]->state) latch_sensors[z]->publish_state(false);
              if (count_sensors[z]->has_state() && count_sensors[z]->state != 0) count_sensors[z]->publish_state(0);
            }
          }

          // 5. Room Tracker Update (Only active Detection zones can hold room occupancy via latch)
          bool any_zone_latched = false;
          for (int z = 0; z < 10; z++) {
            if (z_configured[z] && !z_is_excl[z] && s_zones[z].latched) {
              any_zone_latched = true;
              break;
            }
          }

          s_room.update(targets, max_d, room, vanish_prot, room_timeout, latch_timeout_min, exit_margin, any_zone_latched);
          if (!id(room_occupancy).has_state() || id(room_occupancy).state != s_room.occupied) {
            id(room_occupancy).publish_state(s_room.occupied);
          }
          if (!id(room_stationary_latched).has_state() || id(room_stationary_latched).state != s_room.latched) {
            id(room_stationary_latched).publish_state(s_room.latched);
          }
          if (!id(active_target_count).has_state() || id(active_target_count).state != s_room.target_count) {
            id(active_target_count).publish_state(s_room.target_count);
          }

# --------------------------------------------------------------------
# 10. ACTIVE BLUETOOTH PROXY (For Bermuda BLE Triangulation)
# --------------------------------------------------------------------
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
