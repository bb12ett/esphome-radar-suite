# ====================================================================
# MINIMAL ESPHome Configuration for HLK-LD2450 mmWave Radar
# Use this for a lightweight setup supporting live tracking & zones
# ====================================================================

substitutions:
  node_name: "ld2450-presence"
  friendly_name: "Room Presence"
  tx_pin: "GPIO21"
  rx_pin: "GPIO20"

esphome:
  name: "${node_name}"
  friendly_name: "${friendly_name}"
  min_version: 2024.6.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
ota:
  platform: esphome

# 1. HARDWARE UART BUS
uart:
  id: radar_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# 2. LD2450 COMPONENT
ld2450:
  id: ld2450_radar
  uart_id: radar_uart

# 3. BINARY SENSORS
binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Occupancy"
      id: room_occupancy
      device_class: occupancy
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

  # Zone Occupancies
  - platform: template
    name: "Zone 1 Occupancy"
    id: zone_1_occupancy
    device_class: occupancy
  - platform: template
    name: "Zone 2 Occupancy"
    id: zone_2_occupancy
    device_class: occupancy
  - platform: template
    name: "Zone 3 Occupancy"
    id: zone_3_occupancy
    device_class: occupancy
  - platform: template
    name: "Zone 4 Occupancy"
    id: zone_4_occupancy
    device_class: occupancy

# 4. SENSORS (TARGET TELEMETRY & COORDINATES)
sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Target Count"
      id: target_count_sensor

    target_1:
      x:
        name: "Target 1 X"
        id: target_1_x
      y:
        name: "Target 1 Y"
        id: target_1_y
      speed:
        name: "Target 1 Speed"
        id: target_1_speed
      distance:
        name: "Target 1 Distance"
        id: target_1_distance
      angle:
        name: "Target 1 Angle"

    target_2:
      x:
        name: "Target 2 X"
        id: target_2_x
      y:
        name: "Target 2 Y"
        id: target_2_y
      speed:
        name: "Target 2 Speed"
        id: target_2_speed
      distance:
        name: "Target 2 Distance"
        id: target_2_distance
      angle:
        name: "Target 2 Angle"

    target_3:
      x:
        name: "Target 3 X"
        id: target_3_x
      y:
        name: "Target 3 Y"
        id: target_3_y
      speed:
        name: "Target 3 Speed"
        id: target_3_speed
      distance:
        name: "Target 3 Distance"
        id: target_3_distance
      angle:
        name: "Target 3 Angle"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# 5. CONFIGURATION NUMBERS (ROOM BOUNDARIES & ZONES)
number:
  # Room Geometry Settings (Read by the Lovelace Radar Cards)
  - platform: template
    name: "Room Width"
    id: room_width
    entity_category: config
    unit_of_measurement: "mm"
    min_value: 500
    max_value: 15000
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    name: "Room Depth"
    id: room_depth
    entity_category: config
    unit_of_measurement: "mm"
    min_value: 500
    max_value: 15000
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 5000

  - platform: template
    name: "Sensor Wall Offset X"
    id: sensor_wall_offset_x
    entity_category: config
    unit_of_measurement: "mm"
    min_value: -10000
    max_value: 10000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  - platform: template
    name: "Sensor Mounting Angle"
    id: sensor_mounting_angle
    entity_category: config
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Detection Zone 1
  - platform: template
    name: "Zone 1 X1"
    id: zone_1_x1
    entity_category: config
    unit_of_measurement: "mm"
    min_value: -5000
    max_value: 5000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 Y1"
    id: zone_1_y1
    entity_category: config
    unit_of_measurement: "mm"
    min_value: 0
    max_value: 10000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 X2"
    id: zone_1_x2
    entity_category: config
    unit_of_measurement: "mm"
    min_value: -5000
    max_value: 5000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 Y2"
    id: zone_1_y2
    entity_category: config
    unit_of_measurement: "mm"
    min_value: 0
    max_value: 10000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    name: "Zone 1 Angle"
    id: zone_1_angle
    entity_category: config
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

  # Repeat for Zones 2, 3, and 4 as needed

# 6. SWITCHES & CONTROLS
switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    multi_target:
      name: "Multi Target Tracking"
      id: multi_target_switch
    bluetooth:
      name: "Radar Bluetooth"

button:
  - platform: restart
    name: "Restart ESP32"
