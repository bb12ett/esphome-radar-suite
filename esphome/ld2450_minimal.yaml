# 6. SWITCHES & CONTROLS
switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    multi_target:
      name: "Multi Target Tracking"
      id: multi_target_switch
    bluetooth:
      name: "Radar Bluetooth"

button:
  - platform: restart
    name: "Restart ESP32"

# 7. LIGHTWEIGHT ROTATION-AWARE ROOM & ZONE EVALUATION (200ms)
interval:
  - interval: 200ms
    then:
      - lambda: |-
          bool has_t = id(raw_room_occupancy).state;
          float yaw_rad = id(sensor_mounting_angle).state * (static_cast<float>(M_PI) / 180.0f);
          float cy = cosf(yaw_rad), sy = sinf(yaw_rad);

          float rx[3] = {id(target_1_x).get_raw_state(), id(target_2_x).get_raw_state(), id(target_3_x).get_raw_state()};
          float ry[3] = {id(target_1_y).get_raw_state(), id(target_2_y).get_raw_state(), id(target_3_y).get_raw_state()};
          float rd[3] = {id(target_1_distance).get_raw_state(), id(target_2_distance).get_raw_state(), id(target_3_distance).get_raw_state()};

          float bx1 = id(room_x1).state, by1 = id(room_y1).state, bx2 = id(room_x2).state, by2 = id(room_y2).state;
          bool has_bounds = !(bx1 == 0 && by1 == 0 && bx2 == 0 && by2 == 0);
          float min_bx = std::min(bx1, bx2), max_bx = std::max(bx1, bx2);
          float min_by = std::min(by1, by2), max_by = std::max(by1, by2);

          float tx[3] = {0, 0, 0}, ty[3] = {0, 0, 0};
          bool valid[3] = {false, false, false};
          int room_cnt = 0;

          for (int i = 0; i < 3; i++) {
            if (!has_t || std::isnan(rd[i]) || rd[i] <= 0.0f || std::isnan(rx[i]) || std::isnan(ry[i])) continue;
            tx[i] = rx[i] * cy - ry[i] * sy;
            ty[i] = rx[i] * sy + ry[i] * cy;
            if (has_bounds && (tx[i] < min_bx || tx[i] > max_bx || ty[i] < min_by || ty[i] > max_by)) continue;
            valid[i] = true;
            room_cnt++;
          }

          bool room_occ = (room_cnt > 0);
          if (!id(room_occupancy).has_state() || id(room_occupancy).state != room_occ) id(room_occupancy).publish_state(room_occ);
          if (!id(active_target_count).has_state() || id(active_target_count).state != room_cnt) id(active_target_count).publish_state(room_cnt);

          auto eval_zone = [&](float x1, float y1, float x2, float y2, float z_deg) -> bool {
            if (x1 == 0 && y1 == 0 && x2 == 0 && y2 == 0) return false;
            float min_x = std::min(x1, x2), max_x = std::max(x1, x2);
            float min_y = std::min(y1, y2), max_y = std::max(y1, y2);
            float cx = (min_x + max_x) * 0.5f, cz = (min_y + max_y) * 0.5f;
            float hw = (max_x - min_x) * 0.5f, hh = (max_y - min_y) * 0.5f;
            float zr = -z_deg * (static_cast<float>(M_PI) / 180.0f);
            float czr = cosf(zr), szr = sinf(zr);
            for (int i = 0; i < 3; i++) {
              if (!valid[i]) continue;
              float dx = tx[i] - cx, dy = ty[i] - cz;
              float u = dx * czr - dy * szr;
              float v = dx * szr + dy * czr;
              if (fabsf(u) <= hw && fabsf(v) <= hh) return true;
            }
            return false;
          };

          bool z1 = eval_zone(id(zone_1_x1).state, id(zone_1_y1).state, id(zone_1_x2).state, id(zone_1_y2).state, id(zone_1_angle).state);
          bool z2 = eval_zone(id(zone_2_x1).state, id(zone_2_y1).state, id(zone_2_x2).state, id(zone_2_y2).state, id(zone_2_angle).state);
          bool z3 = eval_zone(id(zone_3_x1).state, id(zone_3_y1).state, id(zone_3_x2).state, id(zone_3_y2).state, id(zone_3_angle).state);
          bool z4 = eval_zone(id(zone_4_x1).state, id(zone_4_y1).state, id(zone_4_x2).state, id(zone_4_y2).state, id(zone_4_angle).state);

          if (!id(zone_1_occupancy).has_state() || id(zone_1_occupancy).state != z1) id(zone_1_occupancy).publish_state(z1);
          if (!id(zone_2_occupancy).has_state() || id(zone_2_occupancy).state != z2) id(zone_2_occupancy).publish_state(z2);
          if (!id(zone_3_occupancy).has_state() || id(zone_3_occupancy).state != z3) id(zone_3_occupancy).publish_state(z3);
          if (!id(zone_4_occupancy).has_state() || id(zone_4_occupancy).state != z4) id(zone_4_occupancy).publish_state(z4);
