# ====================================================================
# MINIMAL ESPHome Configuration for HLK-LD2450 mmWave Radar
# Standalone single-file setup supporting live tracking, mounting
# rotation, room boundaries, and 4 rotated detection zones (no .h file)
# ====================================================================

substitutions:
  node_name: "ld2450-presence"
  friendly_name: "Room Presence"
  tx_pin: "GPIO21"
  rx_pin: "GPIO20"

esphome:
  name: "${node_name}"
  friendly_name: "${friendly_name}"
  min_version: 2024.6.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
ota:
  platform: esphome

# 1. HARDWARE UART BUS
uart:
  id: radar_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# 2. LD2450 COMPONENT
ld2450:
  id: ld2450_radar
  uart_id: radar_uart

# 3. BINARY SENSORS
binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Raw Radar Presence"
      id: raw_room_occupancy
      internal: true
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

  # Room & Zone Occupancies (Evaluated with mounting angle & boundaries)
  - platform: template
    name: "Occupancy"
    id: room_occupancy
    device_class: occupancy
    filters:
      - delayed_off: 5s
  - platform: template
    name: "Zone 1 Occupancy"
    id: zone_1_occupancy
    device_class: occupancy
    filters:
      - delayed_off: 5s
  - platform: template
    name: "Zone 2 Occupancy"
    id: zone_2_occupancy
    device_class: occupancy
    filters:
      - delayed_off: 5s
  - platform: template
    name: "Zone 3 Occupancy"
    id: zone_3_occupancy
    device_class: occupancy
    filters:
      - delayed_off: 5s
  - platform: template
    name: "Zone 4 Occupancy"
    id: zone_4_occupancy
    device_class: occupancy
    filters:
      - delayed_off: 5s

# 4. SENSORS (TARGET TELEMETRY & COORDINATES)
sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Raw Target Count"
      id: raw_target_count
      internal: true

    target_1:
      x:
        name: "Target 1 X"
        id: target_1_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 1 Y"
        id: target_1_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 1 Speed"
        id: target_1_speed
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 1 Distance"
        id: target_1_distance
        filters:
          - throttle_with_priority: 250ms
      angle:
        name: "Target 1 Angle"
        id: target_1_angle
        filters:
          - throttle_with_priority: 500ms

    target_2:
      x:
        name: "Target 2 X"
        id: target_2_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 2 Y"
        id: target_2_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 2 Speed"
        id: target_2_speed
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 2 Distance"
        id: target_2_distance
        filters:
          - throttle_with_priority: 250ms
      angle:
        name: "Target 2 Angle"
        id: target_2_angle
        filters:
          - throttle_with_priority: 500ms

    target_3:
      x:
        name: "Target 3 X"
        id: target_3_x
        filters:
          - throttle_with_priority: 250ms
      y:
        name: "Target 3 Y"
        id: target_3_y
        filters:
          - throttle_with_priority: 250ms
      speed:
        name: "Target 3 Speed"
        id: target_3_speed
        filters:
          - throttle_with_priority: 500ms
      distance:
        name: "Target 3 Distance"
        id: target_3_distance
        filters:
          - throttle_with_priority: 250ms
      angle:
        name: "Target 3 Angle"
        id: target_3_angle
        filters:
          - throttle_with_priority: 500ms

  - platform: template
    name: "Target Count"
    id: active_target_count
    accuracy_decimals: 0

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

# 5. CONFIGURATION NUMBERS (ROOM BOUNDARIES & ZONES 1-4)
number:
  # Room Geometry Settings (Read & written by the Lovelace Radar Cards)
  - platform: template
    name: "Room Width"
    id: room_width
    entity_category: config
    unit_of_measurement: "mm"
    min_value: 500
    max_value: 15000
    step: 100
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    name: "Room Depth"
    id: room_depth
    entity_category: config
    unit_of_measurement: "mm"
